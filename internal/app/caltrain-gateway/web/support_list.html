<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Requests</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
            max-width: min(900px, 90vw);
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }
        h1 { font-size: 1.4rem; margin-bottom: 16px; }
        .meta { color: #666; font-size: 0.9rem; margin-bottom: 24px; }
        .actions { margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px 12px; }
        th { border-bottom: 2px solid #ddd; font-size: 0.85rem; text-transform: uppercase; color: #666; }
        td { border-bottom: 1px solid #eee; vertical-align: top; }
        tr:nth-child(even) td { background: #fafafa; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .empty { color: #999; font-style: italic; padding: 24px 0; }
        .message-preview { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .delete-form { display: inline; }
        .delete-btn {
            background: none; border: none; color: #dc2626; cursor: pointer;
            font-size: 0.9rem; padding: 2px 6px;
        }
        .delete-btn:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Support Requests</h1>
    <p class="meta">{{len .Requests}} request{{if ne (len .Requests) 1}}s{{end}}</p>
    {{if .Requests}}
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Date</th>
                <th>Name</th>
                <th>Email</th>
                <th>Type</th>
                <th>Message</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {{range .Requests}}
            <tr>
                <td><a href="/admin/support/detail?id={{.ID}}">{{.ID}}</a></td>
                <td>{{.CreatedAt.Format "2006-01-02 15:04"}}</td>
                <td>{{.Name}}</td>
                <td>{{.Email}}</td>
                <td>{{.Type}}</td>
                <td class="message-preview">{{.Message}}</td>
                <td><form class="delete-form" method="POST" action="/admin/support/delete?id={{.ID}}"><button type="submit" class="delete-btn">Delete</button></form></td>
            </tr>
            {{end}}
        </tbody>
    </table>
    {{else}}
    <p class="empty">No support requests found.</p>
    {{end}}
</body>
</html>
