<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
            max-width: 640px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 { font-size: 1.4rem; margin-bottom: 24px; }
        ul.nav { list-style: none; padding: 0; margin: 0; }
        ul.nav li { margin: 0 0 12px 0; }
        ul.nav a {
            display: block; padding: 16px 18px; border: 1px solid #e5e7eb;
            border-radius: 6px; text-decoration: none; color: #2563eb;
        }
        ul.nav a:hover { background: #f9fafb; text-decoration: none; }
        ul.nav .desc { display: block; color: #666; font-size: 0.9rem; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>Admin</h1>
    <ul class="nav">
        <li>
            <a href="/admin/support">
                Support requests
                <span class="desc">View and delete user-submitted support requests.</span>
            </a>
        </li>
        <li>
            <a href="/admin/servicealerts">
                Service alerts
                <span class="desc">Browse persisted GTFS-RT alerts and download all entries as JSONL.</span>
            </a>
        </li>
        <li>
            <a href="/admin/departures">
                Train departures
                <span class="desc">Browse observed departure times and delays, and export them as JSONL.</span>
            </a>
        </li>
    </ul>
</body>
</html>
