<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caltrain Gateway</title>
</head>
<body>
    <gateway-dashboard url="/ui/stats" interval="5000"></gateway-dashboard>

    <script>
        class GatewayDashboard extends HTMLElement {
            constructor() {
                super();
                this.attachShadow({ mode: "open" });
                this._intervalId = null;
                this._prevUptime = null;
                this._prevCounts = {};
            }

            connectedCallback() {
                this._render();
                this._refresh();
                const ms = parseInt(this.getAttribute("interval") || "5000", 10);
                this._intervalId = setInterval(() => this._refresh(), ms);
            }

            disconnectedCallback() {
                if (this._intervalId) {
                    clearInterval(this._intervalId);
                }
            }

            /** Formats an uptime value in seconds to a human-readable string. */
            _formatUptime(seconds) {
                const d = Math.floor(seconds / 86400);
                const h = Math.floor((seconds % 86400) / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                const parts = [];
                if (d > 0) parts.push(d + "d");
                if (h > 0) parts.push(h + "h");
                if (m > 0) parts.push(m + "m");
                parts.push(s + "s");
                return parts.join(" ");
            }

            /** Applies a yellow highlight that fades out over 500ms. */
            _highlight(el) {
                el.classList.remove("flash");
                void el.offsetWidth;
                el.classList.add("flash");
            }

            /** Updates a status dot element to reflect a connected/disconnected state. */
            _setStatus(el, ok) {
                el.style.background = ok ? "#22c55e" : "#ef4444";
                el.title = ok ? "Connected" : "Disconnected";
            }

            /** Fetches stats and health from the server and updates the DOM. */
            async _refresh() {
                const url = this.getAttribute("url") || "/ui/stats";
                try {
                    const [statsResp, healthResp] = await Promise.all([
                        fetch(url),
                        fetch("/ui/health"),
                    ]);
                    const data = await statsResp.json();
                    const health = await healthResp.json();

                    const root = this.shadowRoot;
                    const uptimeStr = this._formatUptime(data.uptime_seconds);
                    const uptimeEl = root.getElementById("uptime");
                    uptimeEl.textContent = uptimeStr;
                    if (this._prevUptime !== null && this._prevUptime !== uptimeStr) {
                        this._highlight(uptimeEl);
                    }
                    this._prevUptime = uptimeStr;

                    const tbody = root.getElementById("stats");
                    const endpoints = Object.entries(data.endpoints).sort((a, b) => a[0].localeCompare(b[0]));
                    if (endpoints.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="2">No requests recorded yet.</td></tr>';
                    } else {
                        tbody.innerHTML = endpoints
                            .map(([path, count]) => `<tr><td>${path}</td><td>${count}</td></tr>`)
                            .join("");

                        const rows = tbody.querySelectorAll("tr");
                        endpoints.forEach(([path, count], i) => {
                            if (this._prevCounts[path] !== undefined && this._prevCounts[path] !== count) {
                                this._highlight(rows[i].querySelector("td:last-child"));
                            }
                        });
                    }
                    this._prevCounts = Object.fromEntries(endpoints);

                    // Update status indicators
                    this._setStatus(root.getElementById("api-status"), health.api);
                    this._setStatus(root.getElementById("db-status"), health.database);

                    root.getElementById("last-updated").textContent = new Date().toLocaleString();
                } catch (e) {
                    console.error("Failed to fetch stats:", e);
                }
            }

            /** Renders the initial shadow DOM markup and styles. */
            _render() {
                this.shadowRoot.innerHTML = `
                    <style>
                        :host {
                            display: block;
                            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                            color: #333;
                            max-width: 640px;
                            margin: 40px auto;
                            padding: 0 20px;
                        }
                        h1 { font-size: 1.4rem; margin-bottom: 4px; }
                        .meta { color: #666; font-size: 0.9rem; margin: 0 0 4px; }
                        .meta:last-of-type { margin-bottom: 24px; }
                        table { width: 100%; border-collapse: collapse; }
                        th, td { text-align: left; padding: 8px 12px; }
                        th { border-bottom: 2px solid #ddd; font-size: 0.85rem; text-transform: uppercase; color: #666; }
                        td { border-bottom: 1px solid #eee; }
                        tr:nth-child(even) td { background: #fafafa; }
                        td:last-child, th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
                        @keyframes flash-bg {
                            from { background-color: #fff3b0; }
                            to   { background-color: transparent; }
                        }
                        .flash { animation: flash-bg 500ms ease-out; }
                        .status-section { margin-top: 32px; }
                        .status-section h2 { font-size: 1.1rem; margin-bottom: 12px; }
                        .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 0.95rem; }
                        .status-dot {
                            display: inline-block;
                            width: 12px; height: 12px;
                            border-radius: 50%;
                            background: #d1d5db;
                            flex-shrink: 0;
                        }
                    </style>
                    <h1>Caltrain Gateway</h1>
                    <p class="meta">Uptime: <span id="uptime">-</span></p>
                    <p class="meta">Last updated: <span id="last-updated">-</span></p>
                    <table>
                        <thead>
                            <tr><th>Endpoint</th><th>Requests</th></tr>
                        </thead>
                        <tbody id="stats"></tbody>
                    </table>
                    <div class="status-section">
                        <h2>Service Status</h2>
                        <div class="status-row">
                            <span class="status-dot" id="api-status"></span>
                            <span>511.org API</span>
                        </div>
                        <div class="status-row">
                            <span class="status-dot" id="db-status"></span>
                            <span>Database</span>
                        </div>
                    </div>
                `;
            }
        }

        customElements.define("gateway-dashboard", GatewayDashboard);
    </script>
</body>
</html>
