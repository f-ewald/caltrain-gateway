{{define "content"}}
{{with .Data}}
<h1>Support request #{{.ID}}</h1>
<p class="back"><a href="/admin/support">&larr; Back to support requests</a></p>
<div class="detail">
    <dl>
        <dt>Date</dt>
        <dd>{{.CreatedAt.Format "2006-01-02 15:04:05 MST"}}</dd>

        <dt>Name</dt>
        <dd>{{.Name}}</dd>

        <dt>Email</dt>
        <dd>{{.Email}}</dd>

        <dt>App</dt>
        <dd>{{if .App}}{{.App}}{{else}}<em>not specified</em>{{end}}</dd>

        <dt>Type</dt>
        <dd>{{.Type}}</dd>

        <dt>Message</dt>
        <dd class="message">{{.Message}}</dd>
    </dl>
    <form method="POST" action="/admin/support/delete?id={{.ID}}"
          onsubmit="return confirm('Delete this support request?');">
        <button type="submit" class="delete-btn-lg">Delete request</button>
    </form>
</div>
{{end}}
{{end}}
