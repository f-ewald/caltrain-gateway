{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} &middot; Caltrain Gateway Admin</title>
    <style>
        :root {
            --border: #e5e7eb;
            --muted: #6b7280;
            --link: #2563eb;
            --surface: #f9fafb;
            --danger: #b91c1c;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
            max-width: min(1200px, 94vw);
            margin: 32px auto 64px;
            padding: 0 20px;
        }
        a { color: var(--link); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Header and tabs */
        .brand {
            font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--muted); margin: 0 0 12px 0; font-weight: 600;
        }
        .tabs {
            display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .tabs a {
            padding: 10px 16px; color: var(--muted); text-decoration: none;
            border: 1px solid transparent; border-bottom: none; font-size: 0.92rem;
            border-radius: 6px 6px 0 0; margin-bottom: -1px;
        }
        .tabs a:hover { color: #333; background: var(--surface); text-decoration: none; }
        .tabs a.active {
            color: #111; font-weight: 600; background: #fff;
            border-color: var(--border); border-bottom: 1px solid #fff;
        }

        /* Page heading */
        h1 { font-size: 1.35rem; margin: 0 0 6px 0; }
        .meta { color: var(--muted); font-size: 0.9rem; margin: 0 0 20px 0; }
        .note {
            margin: 0 0 20px 0; padding: 12px 14px; border: 1px solid var(--border);
            border-radius: 6px; background: var(--surface); color: #555; font-size: 0.85rem;
        }
        .back { font-size: 0.9rem; margin: 0 0 20px 0; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
        th, td { text-align: left; padding: 8px 12px; }
        th {
            border-bottom: 2px solid var(--border); font-size: 0.76rem;
            text-transform: uppercase; color: var(--muted); font-weight: 600; white-space: nowrap;
        }
        td { border-bottom: 1px solid #eee; vertical-align: top; }
        tbody tr:hover td { background: var(--surface); }
        .nowrap { white-space: nowrap; }
        .truncate { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; }

        /* Detail pages */
        .detail { max-width: 780px; }
        dl { margin: 0; }
        dt { font-size: 0.76rem; text-transform: uppercase; color: var(--muted); margin-top: 16px; }
        dd { margin: 4px 0 0 0; font-size: 0.95rem; }
        .detail table th { width: 240px; border-bottom: 1px solid #eee; text-transform: none; font-size: 0.87rem; }
        .body-text, .message {
            white-space: pre-wrap; background: var(--surface); padding: 12px;
            border-radius: 4px; border: 1px solid var(--border);
        }

        /* Controls */
        .actions { margin: 0 0 16px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .btn {
            display: inline-block; padding: 7px 14px; border: 1px solid var(--border);
            border-radius: 5px; background: var(--surface); font-size: 0.88rem;
            cursor: pointer; color: var(--link); text-decoration: none;
        }
        .btn:hover { background: #f3f4f6; text-decoration: none; }
        .delete-form { display: inline; }
        .delete-btn {
            background: none; border: none; color: var(--danger); cursor: pointer;
            font-size: 0.88rem; padding: 2px 6px;
        }
        .delete-btn:hover { text-decoration: underline; }
        .delete-btn-lg {
            margin-top: 24px; padding: 8px 16px; border: 1px solid #fecaca;
            background: #fef2f2; color: var(--danger); border-radius: 5px; cursor: pointer;
        }
        .delete-btn-lg:hover { background: var(--danger); color: #fff; }

        /* Filters and paging */
        form.filters { margin: 0 0 20px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
        form.filters label { display: block; font-size: 0.76rem; color: var(--muted); margin-bottom: 4px; }
        form.filters input {
            padding: 7px 9px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 0.88rem;
        }
        .pager { margin-top: 20px; display: flex; gap: 12px; align-items: center; font-size: 0.9rem; }

        /* Status colouring */
        .late { color: var(--danger); font-weight: 600; }
        .early { color: #047857; }
        .empty { color: #999; font-style: italic; padding: 24px 0; }
        .tag {
            display: inline-block; padding: 1px 7px; border-radius: 10px;
            font-size: 0.72rem; border: 1px solid var(--border); color: var(--muted);
        }
        .tag.final { border-color: #a7f3d0; background: #ecfdf5; color: #047857; }
        .tag.unmonitored { border-color: #fde68a; background: #fffbeb; color: #92400e; }
    </style>
</head>
<body>
    <p class="brand">Caltrain Gateway Admin</p>
    <nav class="tabs">
        {{- $active := .ActiveTab}}
        {{- range .Tabs}}
        <a href="{{.Href}}"{{if eq .ID $active}} class="active" aria-current="page"{{end}}>{{.Label}}</a>
        {{- end}}
    </nav>
    {{template "content" .}}
</body>
</html>
{{end}}
